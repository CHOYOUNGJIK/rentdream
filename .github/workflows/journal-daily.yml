name: journal-daily
# 매일 오전 9시 7분(KST)에 _journal/queue.json의 다음 글 1편을 공개한다
on:
  schedule:
    - cron: '7 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 다음 글 공개
        run: python3 _tools/journal.py publish
      - name: 커밋
        run: |
          git config user.name "rentdream-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "journal: 오늘의 글 공개"
          git push
      - name: GitHub Pages 다시 빌드
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true
